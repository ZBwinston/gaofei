<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="稿费记录：把代写接单的每一笔稿费记清楚，本机优先、断网可用、云端同步。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="稿费">
  <title>稿费记录</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 13.5 12 6l8 7.5"/><path d="M6.5 12v8h11v-8"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-4.2 3.4-6 7-6s6.4 1.8 7 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="m15.6 15.6 4.4 4.4"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2L18.5 8"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4.5 15.5-.7 4.7 4.7-.7L19 9l-4-4z"/><path d="m13 7 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6.5 6.5 7.5 20h9l1-13.5M10.5 10.5v6M13.5 10.5v6"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 11.6 1.5 3.8 3.8 0 0 1-.9 7.46z"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 9.3-2.2"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 6.1"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M7.5 3v4M16.5 3v4M3.5 10.5h17"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 16.5z"/><path d="M16.5 11.5h3.5v4h-3.5a2 2 0 0 1 0-4z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M7 19.5V12M12 19.5V5.5M17 19.5v-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M4.5 19.5h15"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m-4.5 4.5L12 4l4.5 4.5M4.5 19.5h15"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.5 1.8-5.5 1.8L12 18.2l-1.8-5.6L4.7 10.8 10.2 9z"/><path d="M18.5 16.5 19.2 19l2.5.7-2.5.7-.7 2.4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6.4V12c0 4.4 2.9 7.3 7 8.5 4.1-1.2 7-4.1 7-8.5V6.4z"/><path d="m8.8 11.9 2.1 2.1 4.3-4.4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.7-1.3-1.8-3.1-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.4 3h-3.6l-.3 2.1A7.6 7.6 0 0 0 8 6.6l-2-.8-1.8 3.1 1.7 1.3a7.6 7.6 0 0 0 0 3l-1.7 1.3 1.8 3.1 2-.8a7.6 7.6 0 0 0 2.5 1.5l.3 2.1h3.6l.3-2.1a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.8-3.1z"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grain"></span>
  </div>

  <div id="app" class="app">
    <header id="app-header" class="app-header"></header>
    <main id="main" class="main" aria-live="polite"></main>
    <button id="fab" class="fab" type="button" aria-label="记一笔" data-action="new">
      <svg class="icon"><use href="#i-plus"></use></svg>
    </button>
    <nav class="tabbar" aria-label="主导航">
      <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
      <button class="tab is-active" type="button" data-tab="overview">
        <svg class="icon"><use href="#i-overview"></use></svg><span>概览</span>
      </button>
      <button class="tab" type="button" data-tab="records">
        <svg class="icon"><use href="#i-list"></use></svg><span>明细</span>
      </button>
      <button class="tab" type="button" data-tab="settings">
        <svg class="icon"><use href="#i-user"></use></svg><span>我的</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-input" type="file" accept="application/json,.json" hidden>

  <div id="boot" class="boot">
    <div class="boot-mark">¥</div>
    <p class="boot-name">稿费记录</p>
  </div>

  <noscript><p style="padding:24px;text-align:center">需要开启 JavaScript 才能使用稿费记录。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
